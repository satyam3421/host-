<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PDF Viewer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    h2 {
      margin-bottom: 15px;
    }

    .controls {
      margin-bottom: 15px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 6px;
    }

    button:hover {
      background: #1e40af;
    }

    .viewer {
      position: relative;
      width: 100%;
      height: 600px;
      border: 2px solid #333;
      background: white;
    }

    /* Loading screen */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      font-weight: bold;
      z-index: 2;
    }

    /* PDF frame */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .links {
      margin-top: 15px;
    }

    a {
      display: inline-block;
      margin-right: 10px;
      color: #2563eb;
    }
  </style>
</head>

<body>

  <h2>📄 PDF Viewer</h2>

  <div class="controls">
    <button onclick="loadPDF('computer.pdf')">Computer PDF</button>
    <button onclick="loadPDF('Robotics.pdf')">Robotics PDF</button>
    <button onclick="loadPDF('Lead User Innovation.pdf')">Lead User Innovation PDF</button>
  </div>

  <div class="viewer">
    <div id="loading">Loading PDF...</div>
    <iframe id="pdfFrame" src="" onload="hideLoader()"></iframe>
  </div>



  <script>
    function loadPDF(file) {
      document.getElementById("loading").style.display = "flex";

      const frame = document.getElementById("pdfFrame");
      frame.src = file;

      document.getElementById("openLink").href = file;
      document.getElementById("downloadLink").href = file;
    }

    function hideLoader() {
      document.getElementById("loading").style.display = "none";
    }

    // default load
    window.onload = function () {
      loadPDF('computer.pdf');
    };
  </script>

</body>

</html>
