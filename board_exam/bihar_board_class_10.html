                    { q: "वैश्वीकरण के मुख्य अंग कितने हैं?", options: ["एक", "दो", "पाँच", "चार"], answer: 2 },
                    { q: "भारत में उपभोक्ता संरक्षण अधिनियम की घोषणा कब हुई?", options: ["1986", "1980", "1987", "1988"], answer: 0 },
                    { q: "स्वर्णभूषणों की परिशुद्धता सुनिश्चित करने के लिए किस मान्यता प्राप्त चिह्न का होना आवश्यक है?", options: ["ISI मार्क", "हॉलमार्क", "एगमार्क", "इनमें से कोई नहीं"], answer: 1 },
                    { q: "नदियों में बाढ़ आने का प्रमुख कारण क्या है?", options: ["जल की अधिकता", "वर्षा की अधिकता", "नदी की तली में अवसाद का जमाव", "इनमें से कोई नहीं"], answer: 2 },
                    { q: "भूकम्प सम्भावित क्षेत्रों में भवनों की आकृति कैसी होनी चाहिए?", options: ["अंडाकार", "त्रिभुजाकार", "चौकोर", "आयताकार"], answer: 3 },
                ]
            }
        ];

        /* ─────────────────────────────────────────
           STATE
        ───────────────────────────────────────── */
        let activeTab = 0;
        // Per-subject answered count
        const answered = new Array(quizData.length).fill(0);
        const totals = quizData.map(s => s.questions.length);
        // Track overall answers for score
        let score = 0;

        /* ─────────────────────────────────────────
           BUILD TABS (lightweight — no DOM yet)
        ───────────────────────────────────────── */
        const tabsEl = document.getElementById("tabs");
        const contentEl = document.getElementById("content");

        quizData.forEach((s, i) => {
            const btn = document.createElement("button");
            btn.className = "tab" + (i === 0 ? " active" : "");
            btn.dataset.i = i;
            btn.innerHTML = s.subject + `<span class="tab-badge" id="badge-${i}">0/${totals[i]}</span>`;
            tabsEl.appendChild(btn);
        });

        /* ─────────────────────────────────────────
           LAZY RENDER — only build active subject
        ───────────────────────────────────────── */
        const rendered = new Array(quizData.length).fill(false);

        function renderSubject(i) {
            if (rendered[i]) return;
            rendered[i] = true;

            const panel = document.createElement("div");
            panel.className = "subject-panel" + (i === 0 ? " active" : "");
            panel.id = "panel-" + i;

            const frag = document.createDocumentFragment();
            const qs = quizData[i].questions;

            for (let q = 0; q < qs.length; q++) {
                const item = qs[q];
                const div = document.createElement("div");
                div.className = "question";

                const h4 = document.createElement("h4");
                h4.textContent = (q + 1) + ". " + item.q;
                div.appendChild(h4);

                // Store answer index & subject index directly as JS props
                div._answer = item.answer;
                div._subjIdx = i;
                div._done = false;

                const opts = item.options;
                const optEls = new Array(opts.length);
                for (let o = 0; o < opts.length; o++) {
                    const opt = document.createElement("div");
                    opt.className = "option";
                    opt._idx = o;
                    opt.textContent = opts[o];
                    optEls[o] = opt;
                    div.appendChild(opt);
                }
                div._opts = optEls;
                frag.appendChild(div);
            }

            panel.appendChild(frag);
            contentEl.appendChild(panel);

            // Single delegated listener per panel
            panel.addEventListener("pointerdown", onAnswer, { passive: true });
        }

        // Render only the first tab immediately
        renderSubject(0);

        /* ─────────────────────────────────────────
           TAB SWITCHING
        ───────────────────────────────────────── */
        tabsEl.addEventListener("click", e => {
            const btn = e.target.closest(".tab");
            if (!btn) return;
            const i = +btn.dataset.i;
            if (i === activeTab) return;

            // Hide old
            document.getElementById("panel-" + activeTab).classList.remove("active");
            tabsEl.children[activeTab].classList.remove("active");

            // Show new (render on demand)
            activeTab = i;
            renderSubject(i);
            document.getElementById("panel-" + i).classList.add("active");
            tabsEl.children[i].classList.add("active");

            // Scroll tab into view
            btn.scrollIntoView({ inline: "nearest", behavior: "smooth" });
            // Scroll content to top
            window.scrollTo({ top: 0, behavior: "instant" });
            updateProgress();
        });

        /* ─────────────────────────────────────────
           ANSWER HANDLER — zero DOM search
        ───────────────────────────────────────── */
        function onAnswer(e) {
            const opt = e.target;
            if (opt.className !== "option") return; // bail fast

            const qDiv = opt.parentElement;
            if (qDiv._done) return;
            qDiv._done = true;
            qDiv.classList.add("done"); // triggers pointer-events:none via CSS

            const correct = qDiv._answer;
            const clicked = opt._idx;

            if (clicked === correct) {
                opt.classList.add("correct");
                score++;
            } else {
                opt.classList.add("wrong");
                qDiv._opts[correct].classList.add("correct");
            }

            answered[qDiv._subjIdx]++;
            updateBadge(qDiv._subjIdx);
            updateProgress();
        }

        /* ─────────────────────────────────────────
           UI UPDATES
        ───────────────────────────────────────── */
        function updateBadge(i) {
            document.getElementById("badge-" + i).textContent =
                answered[i] + "/" + totals[i];
        }

        function updateProgress() {
            const total = totals.reduce((a, b) => a + b, 0);
            const done = answered.reduce((a, b) => a + b, 0);
            document.getElementById("progressFill").style.width =
                Math.round(done / total * 100) + "%";
        }

        /* ─────────────────────────────────────────
           SUBMIT
        ───────────────────────────────────────── */
        function submitQuiz() {
            const total = totals.reduce((a, b) => a + b, 0);
            const done = answered.reduce((a, b) => a + b, 0);
            const pct = Math.round(score / total * 100);

            // Build scoreboard if not done
            let sb = document.getElementById("scoreboard");
            if (!sb.classList.contains("show")) {
                sb.classList.add("show");
                let rows = "";
                quizData.forEach((s, i) => {
                    rows += `<div class="subj-row"><span>${s.subject}</span><span>${answered[i]}/${totals[i]} attempted</span></div>`;
                });
                sb.innerHTML = `
      <div class="score-section">
        <h2>🎯 Score: ${score} / ${total}</h2>
        <p style="font-size:1.3rem;font-weight:700;color:${pct >= 60 ? 'var(--green)' : 'var(--red)'};margin:6px 0">${pct}%</p>
        <p>${done} questions attempted out of ${total}</p>
        <div class="subject-scores">${rows}</div>
      </div>`;
                // Scroll to it
                sb.scrollIntoView({ behavior: "smooth" });
            }
        }
    </script>

    <!-- Scoreboard injected here -->
    <div class="content" style="padding-top:0">
        <div id="scoreboard"></div>
    </div>

</body>

</html>
