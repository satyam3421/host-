<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UPSC Question Papers | Prime Software</title>

<meta name="description" content="Download UPSC Prelims and Mains question papers. Prime Software helps aspirants save time with verified exam resources.">
<meta name="keywords" content="UPSC question papers, IAS, GS paper 1, GS paper 2, GS paper 3, GS paper 4, essay paper">
<meta name="author" content="Prime Software17">
<link rel="canonical" href="https://www.primesoftware17.co.in/">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

/* MAIN CARD */
.container{
    width:92%;
    max-width:520px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.25);
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
    color:#fff;
}

h1{
    font-size:24px;
    margin-bottom:20px;
    font-weight:600;
}

/* BUTTONS */
.btn{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color:#fff;
    transition: all 0.3s ease;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.btn:hover{
    transform: translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.btn:active{
    transform: scale(0.98);
}

/* REDIRECT PAGE */
.redirect-message{
    max-width:700px;
    margin:60px auto;
    padding:30px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.redirect-message h2{
    font-size:22px;
    margin-bottom:15px;
}

.redirect-message p{
    margin-bottom:12px;
    line-height:1.6;
    font-size:15px;
}

.redirect-message a{
    color:#00e5ff;
    font-weight:bold;
    text-decoration:none;
}

.redirect-message a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">
    <h1>📘 UPSC Question Papers</h1>

    <button class="btn" onclick="redirectPage('https://www.upsc.gov.in/sites/default/files/QP_CSP_2026_GENERAL_STUDIES_PAPER-I_25052026.pdf')">
        Prelims GS Paper I (2026)
    </button>

    <button class="btn" onclick="redirectPage('https://www.drishtiias.com/images/pdf/UPSC%20Mains%202025%20GS%20Paper%201.pdf')">
        GS Paper 1
    </button>

    <button class="btn" onclick="redirectPage('https://www.drishtiias.com/images/pdf/UPSC%20Mains%202025%20GS%20Paper%202.pdf')">
        GS Paper 2
    </button>

    <button class="btn" onclick="redirectPage('https://www.drishtiias.com/images/pdf/UPSC%20Mains%202025%20GS%20Paper%203%203.pdf')">
        GS Paper 3
    </button>

    <button class="btn" onclick="redirectPage('https://www.drishtiias.com/images/pdf/UPSC%20Mains%202025%20GS%20Paper%204.pdf')">
        GS Paper 4
    </button>

    <button class="btn" onclick="redirectPage('https://www.drishtiias.com/images/pdf/UPSC%20Mains%202025%20Essay%20Paper.pdf')">
        Essay Paper
    </button>
</div>

<script>
function redirectPage(url){

    document.body.innerHTML = `
    <div class="redirect-message">
        <h2>🚀 Why are you being redirected?</h2>

        <p>
            We have already done the work of finding and verifying the correct UPSC question paper for you.
        </p>

        <p>
            Instead of spending time searching across the internet, you can access the official PDF instantly through our platform.
        </p>

        <p>
            Your time is valuable—focus on preparation, and let us handle the search.
        </p>

        <p>
            For support:
            <br><br>
            <a href="https://tinyurl.com/primesoftware17" target="_blank">
                Contact / Support Link
            </a>
        </p>

        <p><strong>Redirecting...</strong></p>
    </div>
    `;

    setTimeout(()=>{
        window.location.href = url;
    }, 3500);
}
</script>

</body>
</html>
