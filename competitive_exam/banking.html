<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bank Exam Previous Year Question Papers</title>

<meta name="description" content="Bank exam previous year question papers for IBPS, SBI, RBI and other banking exams.">
<meta name="keywords" content="bank exam PYQ, IBPS PO paper, SBI PO question paper, RBI Grade B PDF">
<meta name="author" content="Prime Software17">
<link rel="canonical" href="https://www.primesoftware17.co.in/">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#f4f7fb;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:#fff;
    padding:40px 20px;
    text-align:center;
}

header h1{
    font-size:24px;
}

/* GRID */
.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

/* CARD */
.card{
    background:#fff;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    text-align:center;
}

.card h3{
    margin-bottom:10px;
    color:#1e3c72;
}

/* BUTTON */
.btn{
    display:inline-block;
    padding:10px 14px;
    background:#1e3c72;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

/* REDIRECT MESSAGE */
.redirect-message{
    max-width:700px;
    margin:80px auto;
    padding:30px;
    background:#fff;
    border-radius:14px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    text-align:center;
}

.redirect-message h2{
    color:#1e3c72;
    margin-bottom:15px;
}

.redirect-message p{
    margin-bottom:12px;
    color:#333;
    line-height:1.6;
}

.redirect-message a{
    color:#1e3c72;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <h1>📘 Bank Exam Previous Year Question Papers</h1>
</header>

<div class="container">

    <div class="grid">

        <div class="card">
            <h3>IBPS PO</h3>
            <button class="btn" onclick="redirectUser('IBPS PO')">View Papers</button>
        </div>

        <div class="card">
            <h3>IBPS Clerk</h3>
            <button class="btn" onclick="redirectUser('IBPS Clerk')">View Papers</button>
        </div>

        <div class="card">
            <h3>SBI PO</h3>
            <button class="btn" onclick="redirectUser('SBI PO')">View Papers</button>
        </div>

        <div class="card">
            <h3>RBI Grade B</h3>
            <button class="btn" onclick="redirectUser('RBI Grade B')">View Papers</button>
        </div>

    </div>
</div>

<script>
function redirectUser(exam){

    document.body.innerHTML = `
    <div class="redirect-message">
        <h2>🚀 Why are you being redirected?</h2>

        <p>
            We have already collected and verified the best <b>${exam}</b> previous year question papers for you.
        </p>

        <p>
            Instead of searching multiple websites, you are being redirected to the most relevant and trusted source.
        </p>

        <p>
            This helps you save time and focus directly on preparation instead of searching.
        </p>

        <p>
            For support or queries:
            <br><br>
            <a href="https://tinyurl.com/primesoftware17" target="_blank">
                https://tinyurl.com/primesoftware17
            </a>
        </p>

        <p><b>Redirecting now...</b></p>
    </div>
    `;

    setTimeout(()=>{
        // change this link as needed per exam
        let links = {
            "IBPS PO": "https://www.bankersadda.com/bank-exams-previous-year-question-papers/",
            "IBPS Clerk": "https://www.bankersadda.com/bank-exams-previous-year-question-papers/",
            "SBI PO": "https://www.governmentdailyjobs.com/2025/09/all-bank-exam-previous-year-question.html",
            "RBI Grade B": "https://testbook.com/bank-exams/previous-year-question-papers"
        };

        window.location.href = links[exam];
    }, 3500);
}
</script>

</body>
</html>
