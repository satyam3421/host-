<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSC GD MCQ Practice Set </title>



    <meta name="robots" content="index, follow">

    <meta name="author" content="SSC GD Practice Set">

    <meta property="og:title" content="SSC MCQ Practice Set (Exam Level Questions)">



    <meta property="og:type" content="article">


    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap');

        :root {
            --blue: #1565C0;
            --blue-light: #E3F2FD;
            --green: #2E7D32;
            --red: #C62828;
            --bg: #F0F4F8;
            --card: #ffffff;
            --text: #1a1a2e;
            --border: #d0d7e3;
            --tab-h: 52px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Baloo 2', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg);
            min-height: 100vh;
        }

        /* ── Header ── */
        .header {
            background: var(--blue);
            color: white;
            padding: 16px 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
        }

        .header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: .3px;
        }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 8px 8px 0 0;
            background: rgba(255, 255, 255, .18);
            color: rgba(255, 255, 255, .85);
            font-size: .88rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background .15s, color .15s;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--card);
            color: var(--blue);
        }

        .tab:not(.active):hover {
            background: rgba(255, 255, 255, .28);
        }

        /* ── Progress bar ── */
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, .25);
            position: relative;
            border-radius: 0;
        }

        .progress-fill {
            height: 100%;
            background: #FFD54F;
            border-radius: 2px;
            transition: width .3s ease;
            width: 0%;
        }

        /* ── Main content ── */
        .content {
            max-width: 860px;
            margin: 0 auto;
            padding: 20px 16px 80px;
        }

        /* ── Subject panels (only active rendered) ── */
        .subject-panel {
            display: none;
        }

        .subject-panel.active {
            display: block;
        }

        /* ── Question card ── */
        .question {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px 10px;
            margin-bottom: 14px;
            contain: layout style;
            /* layout containment = faster reflow */
        }

        .question h4 {
            font-size: .95rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        /* ── Options ── */
        .option {
            display: block;
            padding: 9px 12px;
            margin: 5px 0;
            border: 1.5px solid var(--border);
            border-radius: 7px;
            cursor: pointer;
            background: #fafafa;
            font-size: .9rem;
            line-height: 1.4;
            /* GPU-composited only — zero layout cost */
            will-change: transform;
            transition: border-color .1s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .option:active {
            transform: scale(.99);
        }

        /* colour changes via class — no JS style mutation */
        .option.correct {
            background: #E8F5E9;
            border-color: var(--green);
            color: var(--green);
            font-weight: 600;
        }

        .option.wrong {
            background: #FFEBEE;
            border-color: var(--red);
            color: var(--red);
        }

        /* ── Done overlay (blocks re-tap without JS re-check) ── */
        .question.done .option {
            pointer-events: none;
        }

        /* ── Score section ── */
        .score-section {
            background: var(--card);
            border: 2px solid var(--blue);
            border-radius: 12px;
            text-align: center;
            padding: 20px;
            margin-top: 10px;
        }

        .score-section h2 {
            color: var(--blue);
            margin-bottom: 6px;
        }

        .score-section p {
            color: #555;
            font-size: .9rem;
        }

        /* ── Submit button ── */
        .submit-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(transparent, var(--bg) 40%);
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .submit-btn {
            pointer-events: all;
            padding: 13px 40px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(21, 101, 192, .4);
            transition: transform .1s, box-shadow .1s;
        }

        .submit-btn:active {
            transform: scale(.97);
            box-shadow: 0 2px 6px rgba(21, 101, 192, .3);
        }

        /* ── Scoreboard ── */
        #scoreboard {
            display: none;
        }

        #scoreboard.show {
            display: block;
        }

        .subject-scores {
            margin-top: 10px;
        }

        .subj-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: .9rem;
        }

        /* ── Stats badge on tabs ── */
        .tab-badge {
            display: inline-block;
            background: rgba(255, 255, 255, .25);
            color: white;
            font-size: .7rem;
            border-radius: 10px;
            padding: 0 6px;
            margin-left: 4px;
            vertical-align: middle;
        }

        .tab.active .tab-badge {
            background: var(--blue-light);
            color: var(--blue);
        }
    </style>
</head>

<body>

        let activeExam = null;

        const answered = new Array(quizData.length).fill(0);
        const totals = quizData.map(s => s.questions.length);

        // Track overall answers for score
        let score = 0;

        /* ─────────────────────────────────────────
           DOM
        ───────────────────────────────────────── */
        const tabsEl = document.getElementById("tabs");
        const contentEl = document.getElementById("content");

        /* ─────────────────────────────────────────
           GROUP DATA BY EXAM (NEW UI ONLY)
        ───────────────────────────────────────── */
        const exams = [...new Set(quizData.map(q => q.section))];

        /* ─────────────────────────────────────────
           RENDER EXAMS (LEVEL 1)
        ───────────────────────────────────────── */
        function renderExams() {
            tabsEl.innerHTML = "";

            exams.forEach(exam => {
                const btn = document.createElement("button");
                btn.className = "tab";
                btn.textContent = "📘 " + exam;

                btn.onclick = () => {
                    activeExam = exam;
                    renderSubjects(exam);
                };

                tabsEl.appendChild(btn);
            });
        }

        /* ─────────────────────────────────────────
           RENDER SUBJECTS (LEVEL 2)
        ───────────────────────────────────────── */
        function renderSubjects(exam) {
            tabsEl.innerHTML = "";

            const subjects = quizData
                .map((s, i) => ({ ...s, i }))
                .filter(s => s.section === exam);

            // BACK BUTTON
            const back = document.createElement("button");
            back.className = "tab";
            back.textContent = "⬅ Back";

            back.onclick = renderExams;
            tabsEl.appendChild(back);

            subjects.forEach(s => {
                const btn = document.createElement("button");
                btn.className = "tab";
                btn.innerHTML =
                    s.subject +
                    `<span class="tab-badge" id="badge-${s.i}">
                ${answered[s.i]}/${totals[s.i]}
            </span>`;

                btn.onclick = () => {
                    renderSubject(s.i);
                };

                tabsEl.appendChild(btn);
            });
        }

        /* ─────────────────────────────────────────
           LAZY RENDER — only build active subject (UNCHANGED LOGIC)
        ───────────────────────────────────────── */
        const rendered = new Array(quizData.length).fill(false);

        function renderSubject(i) {
            if (rendered[i]) return;
            rendered[i] = true;

            const panel = document.createElement("div");
            panel.className = "subject-panel active";
            panel.id = "panel-" + i;

            const frag = document.createDocumentFragment();
            const qs = quizData[i].questions;

            for (let q = 0; q < qs.length; q++) {
                const item = qs[q];
                const div = document.createElement("div");
                div.className = "question";

                const h4 = document.createElement("h4");
                h4.textContent = (q + 1) + ". " + item.q;
                div.appendChild(h4);

                // Store answer index & subject index directly as JS props
                div._answer = item.answer;
                div._subjIdx = i;
                div._done = false;

                const opts = item.options;
                const optEls = new Array(opts.length);

                for (let o = 0; o < opts.length; o++) {
                    const opt = document.createElement("div");
                    opt.className = "option";
                    opt._idx = o;
                    opt.textContent = opts[o];
                    optEls[o] = opt;
                    div.appendChild(opt);
                }

                div._opts = optEls;
                frag.appendChild(div);
            }

            panel.appendChild(frag);
            contentEl.innerHTML = "";   // only one subject visible
            contentEl.appendChild(panel);

            panel.addEventListener("pointerdown", onAnswer, { passive: true });

            updateProgress();
        }

        /* ─────────────────────────────────────────
           INIT
        ───────────────────────────────────────── */
        renderExams();

        /* ─────────────────────────────────────────
           ANSWER HANDLER — UNCHANGED LOGIC
        ───────────────────────────────────────── */
        function onAnswer(e) {
            const opt = e.target;
            if (opt.className !== "option") return;

            const qDiv = opt.parentElement;
            if (qDiv._done) return;
            qDiv._done = true;
            qDiv.classList.add("done");

            const correct = qDiv._answer;
            const clicked = opt._idx;

            if (clicked === correct) {
                opt.classList.add("correct");
                score++;
            } else {
                opt.classList.add("wrong");
                qDiv._opts[correct].classList.add("correct");
            }

            answered[qDiv._subjIdx]++;
            updateBadge(qDiv._subjIdx);
            updateProgress();
        }

        /* ─────────────────────────────────────────
           UI UPDATES (UNCHANGED LOGIC)
        ───────────────────────────────────────── */
        function updateBadge(i) {
            const el = document.getElementById("badge-" + i);
            if (el) {
                el.textContent = answered[i] + "/" + totals[i];
            }
        }

        function updateProgress() {
            const total = totals.reduce((a, b) => a + b, 0);
            const done = answered.reduce((a, b) => a + b, 0);

            document.getElementById("progressFill").style.width =
                Math.round(done / total * 100) + "%";
        }

        /* ─────────────────────────────────────────
           SUBMIT (UNCHANGED LOGIC)
        ───────────────────────────────────────── */
        function submitQuiz() {
            const total = totals.reduce((a, b) => a + b, 0);
            const done = answered.reduce((a, b) => a + b, 0);
            const pct = Math.round(score / total * 100);

            let sb = document.getElementById("scoreboard");

            if (!sb.classList.contains("show")) {
                sb.classList.add("show");

                let rows = "";
                quizData.forEach((s, i) => {
                    rows += `<div class="subj-row">
                        <span>${s.subject}</span>
                        <span>${answered[i]}/${totals[i]} attempted</span>
                     </div>`;
                });

                sb.innerHTML = `
        <div class="score-section">
            <h2>🎯 Score: ${score} / ${total}</h2>
            <p style="font-size:1.3rem;font-weight:700;color:${pct >= 60 ? 'var(--green)' : 'var(--red)'};margin:6px 0">
                ${pct}%
            </p>
            <p>${done} questions attempted out of ${total}</p>
            <div class="subject-scores">${rows}</div>
        </div>`;

                sb.scrollIntoView({ behavior: "smooth" });
            }
        }
    </script>
